name: Secret scanning

# The canonical copy is in babblevoice/secret-scanning, and every repository in
# its repos.txt carries this file unchanged: change it there first, then copy it
# to all of them in one sweep. Its README explains each choice made here.
#
# What it checks: the commits a push or a pull request adds, with Gitleaks, and
# never the history before them, nor what is already on the default branch.
# The allowlist is the default branch's
# .gitleaks.toml (and .gitleaksignore), never the branch's own copy, so a branch
# cannot allowlist its own secret. Inline `gitleaks:allow` comments are ignored
# for the same reason.
#
# Why two triggers.
#   `push` checks every branch as soon as it is pushed. `pull_request_target`
#   is there because GitHub does not run `pull_request` for a PR from a fork of
#   a private repository, and a required check that never reports leaves the PR
#   unable to merge. It runs the default branch's copy of this file, so a PR
#   cannot weaken the check that is run on it.
#
#   A PR from a branch in the same repository is checked by both, once each.
#   That is deliberate: neither run may be skipped by an `if:`, because GitHub
#   counts a skipped job as a passed required check.
#
# Why this is safe under `pull_request_target`.
#   Nothing from the PR is run. The checkout is the base branch; the PR's
#   commits are fetched as git objects and only read by Gitleaks. The token is
#   read-only and the job uses no secrets.

on:
  push:
    branches: ["**"]
  pull_request_target:

jobs:
  # The org ruleset requires a check with this name. Keep it.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out the default branch's history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the new commits
        env:
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          DELETED: ${{ github.event.deleted }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          has() { git cat-file -e "$1^{commit}" 2>/dev/null; }

          # The allowlist and the ignore list come from the default branch.
          config="$RUNNER_TEMP/gitleaks.toml"
          ignore="$RUNNER_TEMP/gitleaksignore"
          git show "origin/$DEFAULT_BRANCH:.gitleaks.toml" > "$config" 2>/dev/null \
            || printf '[extend]\nuseDefault = true\n' > "$config"
          git show "origin/$DEFAULT_BRANCH:.gitleaksignore" > "$ignore" 2>/dev/null || : > "$ignore"

          if [ "$EVENT" = pull_request_target ]; then
            git fetch --no-tags --quiet origin "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/pr/$PR_NUMBER"
            has "$PR_HEAD" || git fetch --no-tags --quiet origin "$PR_HEAD"
            has "$PR_BASE" || git fetch --no-tags --quiet origin "$PR_BASE"
            revs=("$PR_BASE..$PR_HEAD")
          elif [ "$DELETED" = true ]; then
            echo "The branch was deleted: nothing to scan."
            exit 0
          elif [ "$BEFORE" != "$zero" ] && { has "$BEFORE" \
              || git fetch --no-tags --quiet origin "$BEFORE" 2>/dev/null; }; then
            revs=("$BEFORE..$AFTER")
          else
            # A new branch, or a force push whose old tip is gone: all of it,
            # less the default branch, below. On the default branch itself,
            # its first push or a rewrite of its history: all of it, which
            # after a scrub is the check that the scrub worked.
            revs=("$AFTER")
          fi
          # What is on the default branch was checked when it got there, or is
          # history from before this check. Leaving it out stops a branch that
          # merges the default branch in failing on what that already holds.
          if [ "$EVENT" = pull_request_target ] || [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            revs+=(--not "origin/$DEFAULT_BRANCH")
          fi
          # Counted on its own line, so a range git cannot read fails the job:
          # Gitleaks would pass it, having scanned nothing.
          count=$(git rev-list --count "${revs[@]}")
          echo "Scanning ${revs[*]}: $count commit(s)."

          # Pointed at .git rather than the checkout, so Gitleaks reads no
          # config or ignore file from the working tree. A leak exits 3, so it
          # cannot be mistaken for Gitleaks failing, which exits 1.
          status=0
          "$RUNNER_TEMP/gitleaks" git .git --log-opts="${revs[*]}" \
            --config "$config" --gitleaks-ignore-path "$ignore" --exit-code 3 \
            --ignore-gitleaks-allow --redact --verbose --no-banner --no-color || status=$?
          if [ "$status" = 3 ]; then
            echo "::error title=Secret found::Gitleaks found what looks like a secret in the commits above (its value is not shown). If it is real, rotate it and change how the code gets it, so it is no longer in the repository; if it is a false alarm, allowlist it in .gitleaks.toml in a PR of its own. Guide: https://github.com/babblevoice/secret-scanning"
            exit 1
          elif [ "$status" != 0 ]; then
            echo "::error title=Gitleaks failed::Gitleaks could not finish (see above), so these commits are not checked. A .gitleaks.toml on the default branch that does not parse is the usual cause."
            exit 1
          fi
